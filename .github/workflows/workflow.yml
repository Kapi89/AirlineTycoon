# This starter workflow is for a CMake project running on multiple platforms
name: build and package

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'CMake-Build-Typ bei manuellem Start'
        type: choice
        options:
          - Release
          - Debug
        default: Release
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]

jobs:
  env:
    runs-on: ubuntu-latest

    outputs:
        cmake-build-dir: ${{ steps.compute-env.outputs.cmake-build-dir }}
        artifact-name: ${{ steps.compute-env.outputs.artifact-name }}
        artifact-dir: ${{ steps.compute-env.outputs.artifact-dir }}
        build-type: ${{ steps.compute-env.outputs.build-type }}
        release-name: ${{ steps.compute-env.outputs.release-name }}
        release-tag: ${{ steps.compute-env.outputs.release-tag }}

    steps:
    # Get the code
    - uses: actions/checkout@v4

    # Extract VERSION from resource.h and format it
    # Set global variables and variables based on the branch name
    - name: Compute env
      id: compute-env
      env:
        # nur bei workflow_dispatch gesetzt, sonst leer
        MANUAL_BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        VERSION=$(grep -oP 'FILE_VERSION\s+\K\d+(,\s+\d+){2}' src/Res/resource.h | sed -E 's/[, ]+/./g')

        echo "cmake-build-dir=cmake-build" >> "$GITHUB_OUTPUT"
        echo "artifact-dir=artifacts" >> "$GITHUB_OUTPUT"

        if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "Setting production environment variables..."
            BUILD_TYPE=Release
            echo "release-name=ATD Version $VERSION Release" >> "$GITHUB_OUTPUT"
            echo "artifact-name=AT-$VERSION" >> "$GITHUB_OUTPUT"
            echo "release-tag=v$VERSION" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "Setting development environment variables..."
            BUILD_TYPE=Release
            echo "release-name=ATD Version $VERSION Pre-Release" >> "$GITHUB_OUTPUT"
            echo "artifact-name=AT-$VERSION-preview" >> "$GITHUB_OUTPUT"
            echo "release-tag=v$VERSION-preview" >> "$GITHUB_OUTPUT"
        else
            echo "Setting branch environment variables..."
            BUILD_TYPE=Debug
            echo "release-name=ATD Version $VERSION Preview" >> "$GITHUB_OUTPUT"
            echo "artifact-name=AT-$VERSION-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "release-tag=v$VERSION-${{ github.sha }}" >> "$GITHUB_OUTPUT"
        fi

        # Manueller Start: gewaehlter Build-Typ statt des Standards fuer den Zweig
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "$MANUAL_BUILD_TYPE" ]; then
            BUILD_TYPE="$MANUAL_BUILD_TYPE"
        fi
        echo "build-type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
        cat $GITHUB_OUTPUT

  build:
    needs: env
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 2 configurations:
      # 1. <Windows, Release or Debug, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release or Debug, latest GCC compiler toolchain on the default runner image, default generator>
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        name: ['linux', 'windows', 'macos']
        build_type:
          - ${{ needs.env.outputs.build-type }}
        c_compiler: [gcc, cl]
        cpp_compiler: [g++, cl]
        exclude: # exclude all by default
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-15
        # macOS fest auf macos-15 (arm64, Homebrew unter /opt/homebrew): macos-latest ist seit Oktober 2026 macOS 26,
        # dessen Runner-Pool so knapp ist, dass Jobs oft nach 15 min ohne Runner abgebrochen werden. Ein auf 15
        # gebautes AT laeuft auch auf 26. Sicherheitsnetz: .github/workflows/macos-retry.yml
        include: # only include the configurations we want
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            name: 'windows'
            build_type: ${{ needs.env.outputs.build-type }}
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            name: 'linux'
            build_type: ${{ needs.env.outputs.build-type }}
          - os: macos-15
            c_compiler: gcc
            cpp_compiler: g++
            name: 'macos'
            build_type: ${{ needs.env.outputs.build-type }}
            

    # Execute this for each matrix
    # Warning: Don't get ${{ github.workspace }} from elsewhere! (like precomputed from env job)
    # as GitHub actually set a different path for Windows that make the build fail
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Linux dependencies
      if: matrix.name == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install libjansson-dev libsdl2-dev libsdl2-gfx-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-net-dev libsdl2-ttf-dev

    - name: Setup homebrew (macOS)
      if: matrix.name == 'macos'
      id: set-up-homebrew
      uses: Homebrew/actions/setup-homebrew@2026.09.13.1

    - name: Install macOS dependencies
      if: matrix.name == 'macos'
      run: |
         # Temporary fix, see https://github.com/actions/setup-python/issues/577
         rm /usr/local/bin/2to3-3.12 || true
         rm /usr/local/bin/idle3.13 || true
         rm /usr/local/bin/pydoc3.13 || true
         rm /usr/local/bin/python3.13 || true
         rm /usr/local/bin/python3.13-config || true
         rm /usr/local/bin/2to3 || true
         rm /usr/local/bin/idle3 || true
         rm /usr/local/bin/pydoc3 || true
         rm /usr/local/bin/python3 || true
         rm /usr/local/bin/python3-config || true
         # Update Homebrew and cleanup
         brew update
         brew cleanup
         # Install dependencies
         brew install cmake
         brew install jansson
         brew install sdl2-compat sdl2_mixer sdl2_image sdl2_ttf

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      # Make it verbose with -DCMAKE_VERBOSE_MAKEFILE=ON
      run: >
        cmake -B ${{ needs.env.outputs.cmake-build-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build the program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ needs.env.outputs.cmake-build-dir }} --config ${{ matrix.build_type }}

    # Package the build results (windows)
    - name: Package artifact
      id: artifact-win
      if: matrix.name == 'windows'
      run: |
        # Set variables
        $artifactName = "${{ needs.env.outputs.artifact-name }}-${{ matrix.name }}.zip"
        $artifactPath = "${{ needs.env.outputs.artifact-dir }}/$artifactName"

        # Create the artifact directory if it doesn't exist
        if (!(Test-Path -Path ${{ needs.env.outputs.artifact-dir }} -PathType Container)) {
            New-Item -Path ${{ needs.env.outputs.artifact-dir }} -ItemType Directory -Force
        }

        # Compress the files into the artifact
        Compress-Archive -Path "${{ needs.env.outputs.cmake-build-dir }}/${{ matrix.build_type }}/*" -DestinationPath $artifactPath -Update

        # Output artifact information
        Write-Host "Building windows $artifactName"
        Write-Host "artifact-name=$artifactName"
        Write-Host "artifact-path=$artifactPath"
        echo "artifact-name=$artifactName" >> $Env:GITHUB_OUTPUT
        echo "artifact-path=$artifactPath" >> $Env:GITHUB_OUTPUT

    # Package the build results (linux)
    - name: Package artifact
      id: artifact-linux
      if: matrix.name == 'linux' || matrix.name == 'macos'
      run: |
        echo "Building linux ${{ needs.env.outputs.artifact-name }}-${{ matrix.name }}.tar"
        ARTIFACT_NAME=${{ needs.env.outputs.artifact-name }}-${{ matrix.name }}.tar
        ARTIFACT_PATH=${{ needs.env.outputs.artifact-dir }}/$ARTIFACT_NAME

        mkdir -p ${{ needs.env.outputs.artifact-dir }}
        tar -cvf $ARTIFACT_PATH -C ${{ github.workspace }}/${{ needs.env.outputs.cmake-build-dir }}/${{ matrix.build_type }} .

        echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
        echo "artifact-path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
        cat $GITHUB_OUTPUT

    - name: Publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact-win.outputs.artifact-name || steps.artifact-linux.outputs.artifact-name }}
        path: ${{ steps.artifact-win.outputs.artifact-path || steps.artifact-linux.outputs.artifact-path }}

  # H29: HD_generate.bat einmal komplett auf einem Windows ohne Python durchspielen. Mit kuenstlichen Testdaten
  # (tools/hd_testdaten.py, keine Spieldaten); Modelle und Python-Pakete kommen wie beim Nutzer aus dem Netz.
  # Baut selbst (wie der Windows-Build oben), damit der Test nicht auf die anderen Plattformen wartet.
  hd-test:
    needs: [ env ]
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build
      run: |
        cmake -B cmake-build -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE=Release -S ${{ github.workspace }}
        cmake --build cmake-build --config Release

    - name: Install package and create test data
      run: |
        $spiel = 'C:\hdtest\Airline Tycoon Deluxe'
        New-Item -ItemType Directory -Force -Path $spiel | Out-Null
        Copy-Item -Recurse -Path 'cmake-build\Release\*' -Destination $spiel
        python tools\hd_testdaten.py $spiel
        Get-ChildItem -Recurse $spiel | Where-Object { -not $_.PSIsContainer } | Select-Object -ExpandProperty FullName

    - name: Remove Python (fresh Windows)
      run: |
        # Python des Runners unsichtbar machen: PATH (setzt GITHUB_ENV fuer die folgenden Schritte), py-Launcher, Registry
        $rest = ($env:Path -split ';' | Where-Object { $_ -and $_ -notmatch 'Python' }) -join ';'
        "PATH=$rest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        foreach ($f in @("$env:SystemRoot\py.exe", "$env:SystemRoot\pyw.exe", "$env:LOCALAPPDATA\Programs\Python\Launcher\py.exe")) {
          if (Test-Path $f) { Rename-Item $f ((Split-Path -Leaf $f) + '.weg'); Write-Host "versteckt: $f" }
        }
        foreach ($k in @('HKLM:\SOFTWARE\Python', 'HKCU:\SOFTWARE\Python', 'HKLM:\SOFTWARE\WOW6432Node\Python')) {
          if (Test-Path $k) { Remove-Item $k -Recurse -Force; Write-Host "entfernt: $k" }
        }
        foreach ($d in @("$env:LOCALAPPDATA\Programs\Python", "$env:ProgramFiles\Python*")) {
          Get-ChildItem $d -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "vorhanden: $($_.FullName)" }
        }
        Get-Command winget -ErrorAction SilentlyContinue | Format-List Source, Version

    - name: Check that no Python is found
      run: |
        $treffer = @(Get-Command python, python3, py -All -ErrorAction SilentlyContinue | Where-Object { $_.Source -notmatch 'WindowsApps' })
        $treffer | ForEach-Object { Write-Host "noch da: $($_.Source)" }
        if ($treffer.Count -gt 0) { throw 'Python ist noch auffindbar' }

    - name: Run 1 - HD_generate.bat -Nur schriften,stadtfotos
      shell: cmd
      run: |
        call "C:\hdtest\Airline Tycoon Deluxe\HD_generate.bat" -Ja -Behalten -Nur schriften,stadtfotos

    - name: Check run 1
      run: |
        $spiel = 'C:\hdtest\Airline Tycoon Deluxe'
        function Png([string]$p) {
          $b = [IO.File]::ReadAllBytes($p)
          $w = ([int]$b[18] -shl 8) + [int]$b[19]
          $h = ([int]$b[22] -shl 8) + [int]$b[23]
          return @($w, $h)
        }
        $foto = Png "$spiel\hd\gli\testa1.gli\TESTA1.png"
        $schrift = Png "$spiel\hd\misc\norm_bl.mcf.png"
        Write-Host "Stadtfoto $foto, Schrift $schrift"
        if ($foto[0] -ne 360 -or $foto[1] -ne 240) { throw 'Stadtfoto nicht 4x' }
        if ($schrift[0] -ne 32 -or $schrift[1] -ne 8920) { throw 'Schrift nicht 4x' }
        if (Test-Path "$spiel\hd\gli\glstd.gli") { throw '-Nur nicht beachtet' }
        if (-not (Select-String -Path "$spiel\AT.json" -Pattern '"OptionRenderScale": 4' -Quiet)) { throw 'AT.json nicht eingestellt' }

    # Lauf 2 simuliert beim Export einen Absturz (dublase, muss abgefangen werden) und ein exit() (durede, AT.exe
    # endet; das Skript muss neu starten und den Clip ueberspringen). so_gasmask.smk (Testdaten) brachte libsmacker
    # zum Absturz und muss jetzt durchlaufen.
    - name: Run 2 - HD_generate.bat (everything, resumes, simulated export failures)
      shell: cmd
      env:
        AT_HD_EXPORT_TEST: absturz:dublase,ende:durede
      run: |
        call "C:\hdtest\Airline Tycoon Deluxe\HD_generate.bat" -Ja

    - name: Check run 2
      run: |
        $spiel = 'C:\hdtest\Airline Tycoon Deluxe'
        foreach ($f in @('hd\gli\glstd.gli\MENU.png', 'hd\gli\glbrick.gli\BRICK1.png', 'hd\room\kiosk.gli\ZEITUNG.png',
                         'hd\video\dukau.smk\0000.png', 'hd\video\dukau.smk\crop.csv', 'hd_generate.log')) {
          if (-not (Test-Path "$spiel\$f")) { throw "fehlt: $f" }
        }
        if (Test-Path "$spiel\hd_assets") { throw 'Zwischendateien nicht geloescht' }
        if (Test-Path "$spiel\hd_tools\venv") { throw 'Python-Umgebung nicht geloescht' }
        $log = Get-Content "$spiel\hd_generate.log" -Raw
        foreach ($t in @('Packages already installed', 'present, checksum correct', 'exit code 3 (0x00000003)',
                         'last 20 lines of debug.txt', 'Test-Ende', "It stopped at clip 'durede'", 'Export done: 2 clips',
                         'could not be exported and stay in normal resolution: dublase, durede',
                         'dublase;Absturz, Ausnahme-Code 0xC0000005', 'Done after')) {
          if ($log -notmatch [regex]::Escape($t)) { throw "Log enthaelt nicht: $t" }
        }

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hd_generate-log
        path: C:\hdtest\Airline Tycoon Deluxe\hd_generate.log

  release:
    runs-on: ubuntu-latest
    needs: [ build, env ]
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ needs.env.outputs.artifact-name }}*
        path: ${{ needs.env.outputs.artifact-dir }}
        merge-multiple: true
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        target_commitish: ${{ github.sha }}
        name: ${{ needs.env.outputs.release-name }}
        tag_name: ${{ needs.env.outputs.release-tag }}
        # Nur das Release von master ist ein richtiges Release und "Latest"; Vorabversionen von develop und von
        # Branches sind Pre-releases, damit "Latest release" auf GitHub nie auf eine Vorabversion zeigt.
        prerelease: ${{ github.ref != 'refs/heads/master' }}
        make_latest: ${{ github.ref == 'refs/heads/master' }}
        files: |
          ${{ needs.env.outputs.artifact-dir }}/${{ needs.env.outputs.artifact-name }}*

    # Aeltere Vorabversionen (Tag mit Bindestrich, z. B. v2.0.3-<sha> oder v2.0.3-preview), die noch nicht als
    # Pre-release markiert sind, beim Release von master nachtraeglich als Pre-release markieren.
    - name: Mark older preview builds as pre-release
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        gh api --paginate "repos/$REPO/releases?per_page=100" \
          --jq '.[] | select(.prerelease == false and .draft == false and (.tag_name | test("-"))) | "\(.id) \(.tag_name)"' |
        while read -r id tag; do
          gh api -X PATCH "repos/$REPO/releases/$id" -F prerelease=true -f make_latest=false > /dev/null
          echo "Pre-release: $tag"
        done
        echo "Latest: $(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
